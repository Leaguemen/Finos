name: finos-backend

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_PORT: ${HTTP_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://finos:finos_password@db:5432/finos?sslmode=disable\}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_TTL: ${JWT_TTL:-8h}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finos
      POSTGRES_USER: finos
      POSTGRES_PASSWORD: finos_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finos -d finos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: